<style>
:root{--accent:#0f766e;--bg:#fbfaf8;--fg:#1d2327;--muted:#5d676d;--card:#fff;--line:#e3e0da;--on:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101516;--fg:#eceff0;--muted:#9aa5aa;--card:#171e20;--line:#2a3336;--accent:#2dd4bf;--on:#062a27}}
:root[data-theme=dark]{--bg:#101516;--fg:#eceff0;--muted:#9aa5aa;--card:#171e20;--line:#2a3336;--accent:#2dd4bf;--on:#062a27}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.2rem,8vw,4.2rem)}h2{font-size:clamp(1.6rem,5vw,2.4rem)}h3{font-size:1.15rem}
p{margin:0 0 1em}a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
section{padding:64px 0}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.nav{display:flex;gap:20px;align-items:center}
.nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:0.95rem;transition:color .2s}
.nav a:hover{color:var(--accent)}
.logo{font-weight:800;text-decoration:none}
button,.btn{font:inherit;cursor:pointer}
.btn{display:inline-block;padding:13px 22px;border-radius:12px;font-weight:700;text-decoration:none;border:2px solid var(--accent);background:var(--accent);color:var(--on);transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.icon{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;width:40px;height:40px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{padding:72px 0 56px;min-height:min(80dvh,640px);display:flex;align-items:center}
.hero .lead{font-size:1.2rem;color:var(--muted);max-width:34em}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
@keyframes in{from{opacity:0;transform:translateY(18px)}}
.grid{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));border-top:1px solid var(--line)}
.grid>div{padding:22px 20px 22px 0;border-bottom:1px solid var(--line)}
.grid p,.steps p{color:var(--muted);margin:0}

/* Portfolio loyihalar kartochkalari */
.portfolio-grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:24px}
.project-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s,border-color .25s}
.project-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px -10px color-mix(in srgb,var(--fg) 15%,transparent);border-color:var(--accent)}
.project-img{width:100%;height:180px;object-fit:cover;background:color-mix(in srgb,var(--accent) 10%,var(--card));display:grid;place-items:center;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
.project-body{padding:20px;display:flex;flex-direction:column;flex-grow:1}
.project-body h3{margin:0 0 8px;font-size:1.25rem}
.project-body p{color:var(--muted);font-size:0.95rem;margin:0 0 16px;flex-grow:1}
.project-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tag{font-size:0.8rem;padding:4px 10px;border-radius:20px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
.project-link{align-self:flex-start;text-decoration:none;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;gap:6px;font-size:0.95rem}
.project-link:hover{text-decoration:underline}

.steps{counter-reset:s;list-style:none;padding:0;margin:0;max-width:640px}
.steps li{counter-increment:s;padding:0 0 26px 56px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on);display:grid;place-items:center;font-weight:800}
details{border-bottom:1px solid var(--line);padding:16px 0;max-width:720px}
summary{font-weight:700;cursor:pointer}details p{color:var(--muted);margin:10px 0 0}
.contact{display:grid;gap:32px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.contact ul{list-style:none;padding:0;margin:0}.contact li{margin-bottom:12px}
form,.panel{display:grid;gap:12px}
input,textarea{font:inherit;font-size:16px;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
textarea{min-height:110px;resize:vertical}
footer{padding:28px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
/* ===== ANIMATSIYALAR ===== */
.progress{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;z-index:60}
header.top .wrap{transition:height .3s}header.top.small .wrap{height:46px}
body,.box,input,textarea{transition:background-color .4s,color .4s,border-color .3s,box-shadow .3s}
#theme{transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.hero{position:relative;overflow:hidden}.hero .wrap{position:relative;z-index:1}
.blob{position:absolute;border-radius:50%;background:var(--accent);opacity:.13;pointer-events:none;animation:float 9s ease-in-out infinite}
.b1{width:280px;height:280px;right:-70px;top:30px}.b2{width:120px;height:120px;right:32%;bottom:24px;animation-duration:7s;animation-delay:-3s}.b3{width:56px;height:56px;left:7%;top:16%;animation-delay:-5s}
@keyframes float{50%{transform:translate(-20px,-28px) scale(1.1)}}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.w>span{display:inline-block;transform:translateY(110%);animation:up .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*.1s + .15s)}
@keyframes up{to{transform:none}}
.hero .lead{animation:in .8s .7s ease both}.hero .cta{animation:in .8s .9s ease both}
.btn{transition:transform .2s,box-shadow .25s,background-color .3s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 22px -12px var(--accent)}
.hero .btn:not(.ghost){animation:in .8s .9s ease both,pulse 2.8s 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}70%,100%{box-shadow:0 0 0 14px transparent}}
html.js .rv{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
html.js .rv.in{opacity:1;transform:none}
h2::after{content:"";display:block;height:3px;width:0;background:var(--accent);margin-top:10px;transition:width .8s .3s}h2.in::after{width:56px}
.grid>div{position:relative}.grid>div::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--accent);transition:width .45s}
.grid>div:hover::after{width:100%}.grid h3{transition:transform .3s,color .3s}.grid>div:hover h3{transform:translateX(6px);color:var(--accent)}
.steps{position:relative}
.steps::before{content:"";position:absolute;left:18px;top:8px;bottom:34px;width:2px;background:var(--line)}
.steps::after{content:"";position:absolute;left:18px;top:8px;width:2px;height:calc((100% - 42px)*var(--p,0));background:var(--accent)}
.steps li::before{z-index:1}
html.js .steps li::before{transform:scale(0);transition:transform .55s cubic-bezier(.3,1.6,.5,1)}html.js .steps li.in::before{transform:scale(1)}
summary{list-style:none;display:flex;justify-content:space-between;gap:12px}summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.5rem;line-height:1;color:var(--accent);transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}details[open] p{animation:in .4s ease both}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
/* Admin panel */
#admin{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:20px 0 90px}
body.is-admin #admin{display:block}body.is-admin{overflow:hidden}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row .btn{padding:8px 14px}
.item{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px}
label{font-size:.85rem;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.msg{color:var(--muted);font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"></div>
<header class="top"><div class="wrap">

</main>
<footer><div class="wrap">© <span id="year"></span> <span data-t="brand"></span></div></footer>

<!-- ADMIN PANEL -->
<div id="admin"><div class="wrap">
  <div class="row" style="justify-content:space-between;margin:0 0 16px">
    <h2 style="margin:0">Admin panel</h2><a class="btn ghost" href="#" id="back">Saytga qaytish</a>
  </div>
  <form id="login" class="box">
    <input id="a-email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="a-pass" type="password" placeholder="Parol" autocomplete="current-password" required>
    <button class="btn" type="submit">Kirish</button><small class="msg" id="login-msg"></small>
  </form>
  <div id="editor" hidden></div>
</div></div>

<script type="module">
/* =====================================================================
   1) SOZLAMALAR — QILGAN ISHLARINGIZNI SHU YERGA YOZASIZ
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};

const DEFAULT = {
  brand: "Raimboyev",
  heroTitle: "Raimboyev — Veb-dasturchi",
  heroText: "Zamonaviy veb-saytlar yaratish va dizayn xizmatlari — Xorazm viloyati, Qo'shko'pir. Kichik bizneslar va shaxsiy loyihalar uchun.",
  phone: "+998772243435",
  telegram: "@raimboyev_1",
  instagram: "@raimboyev.1",
  hours: "Dushanba–Juma, 09:00–18:00",
  address: "Xorazm viloyati, Qo'shko'pir, Obi hayot 32",
  projectsTitle: "Mening ishlarim (Portfolio)",
  servicesTitle: "Xizmatlar",
  whyTitle: "Nega aynan men",
  stepsTitle: "Ish bosqichlari",
  faqTitle: "Ko'p so'raladigan savollar",
  contactTitle: "Aloqa",
  // QILGAN ISHLARINGIZ RO'YXATI:
  projects: [
    {
      title: "Saytim.com — Portfolio sayti",
      desc: "Veb-dasturchi uchun shaxsiy vizitka sayt. Tungi/kunduzgi rejim va silliq animatsiyalar mavjud.",
      tags: ["HTML", "CSS", "JavaScript"],
      link: "https://raimboyebsardorbek1-del.github.io/raimboyev",
      image: "project1.png"
    },
    {
      title: "Online Do'kon Landing Page",
      desc: "Mahsulotlar katalogi, qulay buyurtma berish tugmalari va mobil moslashuvchan dizayn.",
      tags: ["Landing Page", "E-tijorat", "UI/UX"],
      link: "#",
      image: ""
    },
    {
      title: "Korxona Vizitka Sayti",
      desc: "Kompaniya xizmatlari, mijozlar fikrlari va aloqa formasi bilan to'liq jihozlangan sayt.",
      tags: ["Biznes", "SEO", "Responsive"],
      link: "#",
      image: ""
    }
  ],
  services: [
    {t: "Veb-sayt yaratish", d: "Zamonaviy, tezkor va mobil qurilmalarga moslashgan saytlar — vizitka, landing page, portfolio."},
    {t: "UI/UX dizayn", d: "Foydalanuvchiga qulay va chiroyli interfeys dizayni — Figma va boshqa zamonaviy vositalar yordamida."},
    {t: "Saytni optimizatsiya qilish", d: "Mavjud saytingizni tezlashtirish, SEO sozlash va mobil versiyasini yaxshilash."}
  ],
  why: [
    {t: "Sifatli va tezkor ish", d: "Har bir loyihani o'z vaqtida, sifatli va zamonaviy standartlarga mos holda bajaraman."},
    {t: "Arzon va hamyonbop narxlar", d: "Kichik bizneslar uchun hamyonbop narxlarda professional darajadagi xizmat ko'rsataman."},
    {t: "Doimiy qo'llab-quvvatlash", d: "Loyiha topshirilgandan keyin ham texnik yordam va maslahat beraman."}
  ],
  steps: [
    {t: "Murojaat va muhokama", d: "Telegram yoki telefon orqali bog'laning. Loyihangiz haqida gaplashamiz va talablarni aniqlaymiz."},
    {t: "Dizayn va ishlab chiqish", d: "Tasdiqlangan dizayn asosida saytni kodlayman. Har bir bosqichda sizga natijani ko'rsataman."},
    {t: "Topshirish va qo'llab-quvvatlash", d: "Tayyor saytni hostingga joylashtiraman va ishga tushiraman. Kerak bo'lsa o'zgartirishlar kiritaman."}
  ],
  faq: [
    {q: "Sayt qilish qancha turadi?", a: "Narx loyihaning murakkabligiga qarab farq qiladi. Oddiy vizitka sayt 500 ming so'mdan boshlanadi. Aniq narx uchun bog'laning."},
    {q: "Sayt qancha vaqtda tayyor bo'ladi?", a: "Oddiy sayt 3–5 kun ichida, murakkab loyihalar 1–2 hafta ichida tayyor bo'ladi."},
    {q: "Hosting va domen kerakmi?", a: "Ha, sayt uchun hosting va domen kerak. Tanlashda yordam beraman va eng yaxshi variantni tavsiya qilaman."},
    {q: "Saytni o'zim boshqara olamanmi?", a: "Albatta! Matnlar, loyihalar va kontakt ma'lumotlarini osongina yangilab turishingiz mumkin."}
  ]
};
const ACCENT = null;
/* ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
let content = structuredClone(DEFAULT);
if (ACCENT) document.documentElement.style.setProperty("--accent", ACCENT);
$("#year").textContent = new Date().getFullYear();

/* Kunduzgi / tungi rejim */
const root = document.documentElement;
try { const s = localStorage.getItem("theme"); if (s) root.dataset.theme = s; } catch (e) {}
let spin = 0;
$("#theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  spin += 180; $("#theme").style.transform = `rotate(${spin}deg)`;
};

/* ===== Animatsiya yordamchilari ===== */
document.documentElement.classList.add("js");
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .15 });
function reveal() {
  document.querySelectorAll("section h2,.grid>div,.steps li,details,.contact>*, .project-card").forEach(n => {
    if (n.classList.contains("rv")) return;
    n.classList.add("rv"); n.style.setProperty("--d", (([...n.parentElement.children].indexOf(n)) % 6) * .09 + "s"); io.observe(n);
  });
}
function animTitle(text) {
  const h = $("#h1"); if (h.dataset.t0 === text) return; h.dataset.t0 = text;
  h.replaceChildren(...String(text).split(" ").map((w, i) => { const a = el("span", "w"), b = el("span", "", w + "\u00a0"); b.style.setProperty("--i", i); a.append(b); return a; }));
}
const handle = v => String(v || "").replace(/^@/, "");
function render(c) {
  document.querySelectorAll("[data-t]").forEach(n => { if (n.id !== "h1") n.textContent = c[n.dataset.t] ?? ""; });
  animTitle(c.heroTitle);
  document.querySelectorAll("[data-link=tg]").forEach(a => a.href = "https://t.me/" + handle(c.telegram));
  document.querySelectorAll("[data-link=ig]").forEach(a => a.href = "https://instagram.com/" + handle(c.instagram));
  document.querySelectorAll("[data-link=tel]").forEach(a => a.href = "tel:" + String(c.phone).replace(/[^\d+]/g, ""));
  const fill = (id, arr, mk) => { const box = $(id); if(box) box.replaceChildren(...(arr || []).map(mk)); };
  
  // Loyihalar (Portfolio)
  const renderProject = p => {
    const card = el("div", "project-card");
    if(p.image) {
      const img = el("img", "project-img");
      img.src = p.image; img.alt = p.title; img.loading = "lazy";
      card.append(img);
    } else {
      const ph = el("div", "project-img", p.title || "Loyiha");
      card.append(ph);
    }
    const b = el("div", "project-body");
    b.append(el("h3", "", p.title));
    b.append(el("p", "", p.desc));
    if (p.tags && p.tags.length) {
      const tgBox = el("div", "project-tags");
      p.tags.forEach(t => tgBox.append(el("span", "tag", t)));
      b.append(tgBox);
    }
    if (p.link && p.link !== "#") {
      const a = el("a", "project-link", "Saytni ko'rish →");
      a.href = p.link; a.target = "_blank"; a.rel = "noopener";
      b.append(a);
    }
    card.append(b);
    return card;
  };
  fill("#projects-list", c.projects, renderProject);

  const card = i => { const d = el("div"); d.append(el("h3", "", i.t), el("p", "", i.d)); return d; };
  fill("#services-list", c.services, card);
  fill("#why-list", c.why, card);
  fill("#steps-list", c.steps, i => { const l = el("li"); l.append(el("h3", "", i.t), el("p", "", i.d)); return l; });
  fill("#faq-list", c.faq, i => { const d = el("details"); d.append(el("summary", "", i.q), el("p", "", i.a)); return d; });
  reveal();
}
render(content);

/* Skroll effektlari */
const bar = $(".progress"), hd = $("header.top"), st = $("#steps-list");
function onScroll() {
  const y = scrollY, h = document.documentElement.scrollHeight - innerHeight;
  bar.style.transform = `scaleX(${h > 0 ? y / h : 0})`;
  hd.classList.toggle("small", y > 40);
  const r = st.getBoundingClientRect();
  st.style.setProperty("--p", Math.min(1, Math.max(0, (innerHeight * .7 - r.top) / r.height)));
  document.querySelectorAll(".blob").forEach((b, i) => b.style.translate = `0 ${Math.round(y * (.05 + i * .04))}px`);
}
addEventListener("scroll", onScroll, { passive: true }); onScroll();

/* Aloqa formasi */
$("#contact-form").onsubmit = e => {
  e.preventDefault();
  const txt = `Ism: ${$("#f-name").value}\nTelefon: ${$("#f-phone").value}\n${$("#f-msg").value}`;
  location.href = "https://t.me/" + handle(content.telegram) + "?text=" + encodeURIComponent(txt);
};

/* =====================================================================
   2) FIREBASE
   ===================================================================== */
const configured = !FIREBASE_CONFIG.apiKey.startsWith("YOUR");
let fb = null;
async function loadFirebase() {
  if (fb || !configured) return fb;
  const V = "10.12.2", B = `https://www.gstatic.com/firebasejs/${V}/`;
  const [app, auth, fs] = await Promise.all([import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-firestore.js")]);
  const a = app.initializeApp(FIREBASE_CONFIG);
  fb = { auth: auth.getAuth(a), db: fs.getFirestore(a), ...auth, ...fs };
  return fb;
}
(async () => {
  try {
    const f = await loadFirebase(); if (!f) return;
    const snap = await f.getDoc(f.doc(f.db, "site", "content"));
    if (snap.exists()) { content = { ...DEFAULT, ...snap.data() }; render(content); }
  } catch (e) { console.warn("Firestore o'qilmadi, standart matn ishlatildi", e); }
})();

/* Admin paneli */
const FIELDS = [["brand","Biznes nomi"],["heroTitle","Bosh sarlavha"],["heroText","Qisqa izoh","area"],["phone","Telefon"],["telegram","Telegram (@nom)"],["instagram","Instagram (@nom)"],["hours","Ish vaqti"],["address","Manzil"],["projectsTitle","Mening ishlarim sarlavhasi"],["servicesTitle","Xizmatlar sarlavhasi"],["whyTitle","«Nega biz» sarlavhasi"],["stepsTitle","Bosqichlar sarlavhasi"],["faqTitle","Savollar sarlavhasi"],["contactTitle","Aloqa sarlavhasi"]];
const LISTS = [["services","Xizmatlar","t","Nomi","d","Tavsif"],["why","Nega biz","t","Sabab","d","Izoh"],["steps","Ish bosqichlari","t","Bosqich","d","Izoh"],["faq","Savol-javoblar","q","Savol","a","Javob"]];
let draft = null;

function buildEditor() {
  const ed = $("#editor"); ed.replaceChildren();
  const input = (label, val, area, set) => {
    const w = el("div"); w.append(el("label", "", label));
    const i = el(area ? "textarea" : "input"); i.value = val || ""; i.oninput = () => set(i.value); w.append(i); return w;
  };
  const b1 = el("div", "box"); b1.append(el("h3", "", "Matnlar"));
  FIELDS.forEach(([k, l, a]) => b1.append(input(l, draft[k], a, v => draft[k] = v)));
  ed.append(b1);
  LISTS.forEach(([key, title, k1, l1, k2, l2]) => {
    const box = el("div", "box"); box.append(el("h3", "", title));
    const arr = draft[key] = draft[key] || [];
    arr.forEach((it, idx) => {
      const row = el("div", "item");
      row.append(input(l1, it[k1], false, v => it[k1] = v), input(l2, it[k2], true, v => it[k2] = v));
      const ctl = el("div", "row");
      const btn = (txt, fn, dis) => { const b = el("button", "btn ghost", txt); b.type = "button"; b.disabled = dis; b.onclick = () => { fn(); buildEditor(); }; ctl.append(b); };
      btn("↑", () => [arr[idx - 1], arr[idx]] = [arr[idx], arr[idx - 1]], idx === 0);
      btn("↓", () => [arr[idx + 1], arr[idx]] = [arr[idx], arr[idx + 1]], idx === arr.length - 1);
      btn("O'chirish", () => arr.splice(idx, 1));
      row.append(ctl); box.append(row);
    });
    const add = el("button", "btn", "+ Qo'shish"); add.type = "button";
    add.onclick = () => { arr.push({ [k1]: "", [k2]: "" }); buildEditor(); };
    box.append(add); ed.append(box);
  });
  const bar = el("div", "bar"), save = el("button", "btn", "Saqlash"), out = el("button", "btn ghost", "Chiqish"), msg = el("span", "msg");
  save.onclick = async () => {
    msg.textContent = "Saqlanmoqda…";
    try { await fb.setDoc(fb.doc(fb.db, "site", "content"), draft); content = { ...DEFAULT, ...draft }; render(content); msg.textContent = "Saqlandi ✓"; }
    catch (e) { msg.textContent = "Xato: ruxsat yo'q yoki tarmoq muammosi"; }
  };
  out.onclick = () => fb.signOut(fb.auth);
  bar.append(save, out, msg); ed.append(bar);
}

async function openAdmin() {
  document.body.classList.add("is-admin");
  const msg = $("#login-msg");
  if (!configured) { msg.textContent = "Avval FIREBASE_CONFIG'ni to'ldiring."; return; }
  const f = await loadFirebase();
  f.onAuthStateChanged(f.auth, u => {
    $("#login").hidden = !!u; $("#editor").hidden = !u;
    if (u) { draft = structuredClone(content); buildEditor(); }
  });
}
$("#login").onsubmit = async e => {
  e.preventDefault();
  try { await fb.signInWithEmailAndPassword(fb.auth, $("#a-email").value, $("#a-pass").value); $("#a-pass").value = ""; }
  catch (err) { $("#login-msg").textContent = "Email yoki parol noto'g'ri."; }
};
const route = () => {
  if (location.hash === "#admin") openAdmin(); else document.body.classList.remove("is-admin");
};
addEventListener("hashchange", route); route();
$("#back").onclick = () => { document.body.classList.remove("is-admin"); };
</script>
